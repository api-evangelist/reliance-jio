    url: skills/reliance-jio-create-and-record-a-meeting.md
- aid: reliance-jio:jiomeet-platform-oauth-api
  name: JioMeet Platform OAuth API
  description: User-authorized REST API for JioMeet, using OAuth 2.0. An access and
    refresh token are obtained from the /api/oauth2/v2/token endpoint using HTTP Basic
    authentication with an OAuth client id and secret, and subsequent calls use HTTP
    Bearer authentication. Documented operations cover creating, fetching, listing,
    updating and deleting a user's scheduled meetings and fetching user profile info.
  humanURL: https://dev.jiomeet.com/docs/JioMeet%20Platform%20OAuth%20APIs/jiomeet-user-oauth-apis
  baseURL: https://jiomeetpro.jio.com
