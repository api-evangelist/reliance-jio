name: Reliance Jio
kind: company
description: Reliance Jio Infocomm, the telecom arm of Jio Platforms Limited and Reliance
  Industries, is India's largest mobile network operator, serving roughly half a billion
  subscribers on an all-IP 4G/5G network from its home market of India, alongside JioFiber
  broadband, JioAirFiber fixed wireless, IoT connectivity, and an enterprise CPaaS
  business branded JioCX. Jio sits at the network-operator layer of the telecom value
  chain and its API posture is split in two. Its BSS/OSS side is unusually standards-forward
  - Jio was the first communications service provider to reach TM Forum Open API Platinum
  conformance, with more than twenty certified Open APIs - but those interfaces are
  internal supplier-integration contracts, not a public developer product. Its network
  APIs are genuinely live, since Jio launched the CAMARA SIM Swap API alongside Bharti
  Airtel
  and Vodafone Idea under GSMA Open Gateway, and Jio is one of the twelve carrier equity
  owners of Aduna, the Ericsson-led network-API joint venture. There is, however, no
  first-party Open Gateway developer portal - opengateway.jio.com and developers.opengateway.jio.com
  do not resolve - so those network APIs are partner-gated and reachable only through
  the Aduna aggregation channel, the GSMA federated hub, and CPaaS partners rather
  than directly from Jio. What Jio does publish self-serve is a real developer portal
  for its SaaS products at dev.jiomeet.com, covering the JioMeet and JioEvents platform
  REST APIs with JWT and OAuth 2.0 auth and thirty-four public client SDK repositories,
  plus a set-top-box app developer programme at developer.jio.com. Jio serves no
  downloadable OpenAPI or Swagger document anywhere across those surfaces, but the
  dev.jiomeet.com reference is generated by the docusaurus-openapi-docs plugin and its
  build embeds the real OpenAPI operation objects - method, path, servers, parameters,
  request bodies, responses and security schemes - which API Evangelist harvested into
  three OpenAPI 3.0.3 documents covering 29 operations on two previously undocumented
  hosts, jiomeetpro.jio.com and jioevents.com.
