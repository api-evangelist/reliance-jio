- aid: reliance-jio:jiopayments-stb-api
  name: JioPayments Set-Top-Box API
  description: In-app purchase and digital content payment API for applications published
    on the Jio set-top box, distributed by Jio Platforms as a downloadable PDF API
    specification (v1.1) from the JioDevelopers set-top-box developer page. The specification
    PDF is publicly retrievable without login; the developer console that issues credentials
    is behind a sign-up wall.
  humanURL: https://developer.jio.com/set-top-box.html
  tags:
  - Payments
  - Set-Top Box
