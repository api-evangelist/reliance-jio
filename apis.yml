apis:
- aid: reliance-jio:jiomeet-platform-server-api
  name: JioMeet Platform Server API
  description: Server-to-server REST API for the JioMeet video meeting platform, documented
    publicly at dev.jiomeet.com. Covers creating dynamic meetings, creating, fetching,
    updating and deleting scheduled meetings, starting, stopping and listing recordings,
    checking recording status, listing chat threads, and pulling meeting reports. Authentication
    is an HS256-signed JWT built from an app id and secret generated in the JioMeet
    platform console. No public base URL is stated in the documentation and no OpenAPI
    document is served, but the OpenAPI source is embedded in the published documentation
    build and has been harvested to openapi/ (11 operations, server https://jiomeetpro.jio.com).
  humanURL: https://dev.jiomeet.com/docs/JioMeet%20Platform%20Server%20APIs/jiomeet-platform-apis
  baseURL: https://jiomeetpro.jio.com
  tags:
  - Video
  - Meetings
  - Recording
  - Collaboration
  properties:
  - type: Documentation
    url: https://dev.jiomeet.com/docs/quick-start/integrate-with-ser
  - type: APIReference
    url: https://dev.jiomeet.com/docs/JioMeet%20Platform%20Server%20APIs/jiomeet-platform-apis
