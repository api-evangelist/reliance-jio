- aid: reliance-jio:jioevents-platform-server-api
  name: JioEvents Platform Server API
  description: Server-side REST API for JioEvents, Jio's webinar and virtual event
    platform, documented alongside JioMeet at dev.jiomeet.com. Covers creating, fetching,
    updating and deleting scheduled webinars, creating, listing and deleting sessions,
    creating, listing and deleting meeting invites, and downloading attendance and
    registration reports.
  humanURL: https://dev.jiomeet.com/docs/JioEvents%20Platform%20Server%20APIs/jioevents-platform-apis
