method: searched
description: >-
  First-party Reliance Jio client libraries. Everything below is published by Jio
  under the JioMeet GitHub organization (github.com/JioMeet, 34 public repositories),
  the @jiomeet npm scope, the CocoaPods trunk, or GitHub Packages Maven. Distribution
  is deliberately uneven: web and React Native ship through public npm, iOS through
  CocoaPods and a Swift Package Manager repository that vends XCFrameworks, Android
  through a GitHub Packages Maven repository that requires a personal access token
  with read:packages (NOT Maven Central - a Maven Central search for "jiomeet"
  returns zero artifacts), and Flutter through a git dependency (NOT pub.dev - a
  pub.dev search for "jiomeet" returns no first-party package). There is no Python,
  Go, Ruby, PHP, .NET or Rust SDK, and no server-side SDK of any kind: every package
  is a client-side real-time-communication SDK. The three REST APIs documented at
  dev.jiomeet.com have no client library at all.
sdk_scope: client-side RTC / UI only - no server SDK for the REST APIs
