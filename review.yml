aid: reliance-jio
name: Reliance Jio
review:
  question: Does Reliance Jio publish a real, self-serve public API surface, and what
    is its CAMARA / GSMA Open Gateway posture?
  answer: partial
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: India
  tier: mno-carrier
  summaryVerdict: |
    Reliance Jio is the sector's split personality in a single company. Its network
    APIs are real - it launched the CAMARA SIM Swap API under GSMA Open Gateway and
    owns equity in Aduna - but there is no first-party network-API developer portal
    at all, so developers reach those APIs only through Aduna, the GSMA federated
    hub, or a CPaaS partner. Meanwhile a genuinely self-serve, publicly documented
    REST API portal does exist at dev.jiomeet.com, but it is for Jio's SaaS video
    products (JioMeet, JioEvents), not for the network. Not one machine-readable
    OpenAPI or Swagger document is served anywhere across any Jio property.
findings:
  developerPortals:
  - url: https://developer.jio.com/
    status: 200
    verdict: real-but-narrow
    note: |
      "Jio Developers Platform" - a live first-party developer programme at the primary
      domain, but scoped entirely to building and publishing apps for the Jio set-top
      box. Public downloads (SDK bundle, device specs, submission guidelines, a
      JioPayments STB API specification PDF) are retrievable without login; the console
      itself is behind LOGIN / SIGN UP. Footer reads "2022 (c) Jio Platforms Limited",
      indicating the programme has not been refreshed in years. Not a network-API portal.
  - url: https://dev.jiomeet.com/
    status: 200
    verdict: real-self-serve-portal
    note: |
      The one genuinely self-serve API developer portal Reliance Jio operates. Docusaurus
      site, copyright "Reliance Jio Infocomm Ltd.", carrying quick-start guides, an
      authentication guide, a per-operation API reference for three API suites, SDK
      docs for Web / Android / iOS, a GitHub link, and a Sign Up link to the JioMeet
      platform console. Free to read, no wall on the documentation.
  - url: https://platform.jiomeet.com/
    status: 200
    verdict: self-serve-console
    note: JioMeet platform console where an app id and secret (or OAuth client) are
      generated. Single-page app; deep link /login/signUp returns 404 to a direct
      server request but the console root loads.
  - url: https://developer.jiogames.com/
    status: 200
    verdict: developer-programme-no-api
    note: JioGames Developer Program marketing site; documentation lives at
      https://publish.jiogames.com/documents/ (200) and covers account setup, game
      submission, JioAds account management and SDK integration. No REST API reference
      and no specification is published.
  deadOrAbsentSubdomains:
  - url: https://developers.jio.com/
    status: 000
    note: does not resolve
  - url: https://docs.jio.com/
    status: 000
    note: does not resolve
  - url: https://opengateway.jio.com/
    status: 000
    note: does not resolve - no first-party Open Gateway portal
  - url: https://developers.opengateway.jio.com/
    status: 000
    note: does not resolve - the Telefonica-style Open Gateway subdomain pattern is
      not used by Jio
  - url: https://api.jio.com/
    status: 403
    note: responds, but forbidden and undocumented; no public API is documented behind it
  - url: https://www.jio.com/developer
    status: 200
    note: redirects to https://www.jio.com/page-not-found.html
  - url: https://www.jio.com/developers
    status: 200
    note: redirects to https://www.jio.com/page-not-found.html
  - url: https://www.jio.com/opengateway
    status: 200
    note: redirects to https://www.jio.com/page-not-found.html
  - url: https://www.jio.com/business/api
    status: 200
    note: redirects to https://www.jio.com/page-not-found.html
  - url: https://www.jiocx.com/
    status: 403
    note: JioCX CPaaS brand domain returns 403 Forbidden; the CPaaS product is
      described only on marketing pages under jio.com/business with no developer docs
  downloadableSpecs:
    openapiFound: true
    servedAsDownload: false
    count: 3
    operations: 29
    correction: |
      SUPERSEDES the 2026-07-25 first-pass finding of "no machine-readable API
      description". Jio still serves no downloadable spec at any conventional path, but
      the enrichment round of 2026-07-25 recovered the real thing from the site's own
      build output. dev.jiomeet.com is a Docusaurus 2.2.0 site built with the
      docusaurus-openapi-docs plugin; the plugin compiles each operation's OpenAPI object
      into the per-page JavaScript chunk. Walking the webpack registry in
      /assets/js/main.*.js to the 29 *.api.mdx page chunks, then resolving each chunk
      through the runtime map, yields the verbatim operation objects - method, path,
      servers, tags, parameters, requestBody, responses and securitySchemes. Reassembled
      into three OpenAPI 3.0.3 documents in openapi/ (raw JSON in openapi/_original/):
        - JioMeet Platform APIs      11 ops  server https://jiomeetpro.jio.com
        - JioMeet User OAuth APIs     7 ops  server https://jiomeetpro.jio.com
        - JioEvents Platform APIs    11 ops  server https://jioevents.com
      Two consequences beyond the specs themselves. First, the base URLs are recovered:
      the review correctly recorded that no host is stated in Jio's prose, and
      jioevents.com in particular is a host no Jio documentation page names. Second, the
      source spec declares no operationIds and no components.schemas - every schema is
      inline - so the operationIds used by skills/ and mcp/ are assigned by the
      overlays/, not by Jio.
    note: |
      No machine-readable API description was found. Probed /openapi.json, /openapi.yaml,
      /swagger.json, /api-docs, /spec and /redoc against dev.jiomeet.com (all 404) and
      publish.jiogames.com/documents (all 404). The dev.jiomeet.com reference pages are
      generated by the docusaurus-openapi-docs plugin - the rendered HTML carries plugin
      class names such as "openapi-tabs__security-schemes" - which proves an OpenAPI
      source document exists internally, but it is never served. The site's own
      sitemap.xml is emitted with the placeholder host your-docusaurus-test-site.com.
      The only downloadable API specification of any kind is a PDF:
      https://jiomedia.akamaized.net//JioStore/Downloads/DeveloperToolKit/STB/JioPayments-STB-APISpecs-v1.1.pdf
      (HTTP 200, application/pdf, 544,347 bytes, Last-Modified 2024-08-21). PDF is not
      a machine-readable specification, so nothing was harvested into openapi/.
  camara:
    posture: CAMARA SIM Swap launched, but no first-party portal - reachable only via
      Aduna and the GSMA federated hub
    apisWithEvidence:
    - SIM Swap
    apisAnnouncedNotConfirmedCallable:
    - Number Verification
    evidence: |
      GSMA press release dated 9 October 2025 (HTTP 200, verified verbatim):
      "Bharti Airtel, Reliance Jio and Vodafone Idea have already launched the SIM Swap
      API, which help banks prevent account takeover attacks..." and "All three operators
      also plan to launch a CAMARA-based Number Verification API before the end of 2025."
      The same release describes the developer channel as federated rather than
      first-party: the operators "outlined plans to provide enterprise developers at
      banks and online retailers with federated access to new services including the
      SIM Swap and Number Verification APIs. Federated CAMARA APIs, certified by the
      GSMA, help developers build services that work with every participating mobile
      network, while allowing each operator to keep control of its data, policy and
      revenue."
      This is more than a press release - SIM Swap is stated as launched, not planned -
      but Jio publishes nothing callable itself. Number Verification remains, on the
      evidence found, an announcement: no Jio-hosted documentation, endpoint, sandbox
      or spec for it exists.
    firstPartySurface: none
    note: |
      Zero CAMARA artifacts are published by Jio. There is no Open Gateway landing page
      on jio.com, no opengateway.* subdomain, no sandbox, no CIBA authorization endpoint,
      no CAMARA OpenAPI mirror, and no reference to camaraproject.org anywhere on a Jio
      property that was crawled. The CAMARA specifications Jio implements are the ones
      published by the CAMARA project on GitHub, not by Jio.
  openGateway:
    participant: true
    evidence: Named by the GSMA as one of India's three operators strengthening
      anti-scam work "through the GSMA Open Gateway initiative", 9 October 2025.
    firstPartyPortal: false
  aduna:
    equityOwner: true
    note: |
      Reliance Jio is one of the twelve carrier equity owners of Aduna, the Ericsson-led
      network-API joint venture (Ericsson 50 percent; AT&T, Bharti Airtel, Deutsche
      Telekom, KDDI, Orange, Reliance Jio, Singtel, Telefonica, Telstra, T-Mobile,
      Verizon and Vodafone holding the other 50 percent collectively), completed July
      2025. Aduna is therefore the commercial channel through which Jio's network APIs
      reach developers. This is the central finding for this provider: Jio's network
      API business is intermediated by design.
  tmForum:
    conformance: true
    level: Open API Platinum
    note: |
      Reliance Jio was the first communications service provider to achieve TM Forum
      Open API Platinum conformance certification, reported as 23 certifications
      covering more than 20 Open APIs; Jio has been a TM Forum member since 2010, and
      the certification is positioned around building an agile environment for its 5G
      services. A public conformance report is hosted by TM Forum for TMF653:
      https://s3.us-east-1.amazonaws.com/tmf-sfdc-public/Conformance/CON-01539/JIO-Certification%20Report-TMF653%20API-Aug2022.pdf
      (HTTP 200, application/pdf, 477,083 bytes). These are BSS/OSS supplier-integration
      interfaces. Not one of them is publicly callable or publicly documented by Jio -
      the classic carrier pattern of holding real, certified standards conformance while
      publishing nothing a developer can use.
  threeGppExposure:
    nefOrScefFound: false
    networkSlicingApi: false
    edgeMecApi: false
    note: No NEF, SCEF, network-slicing or edge/MEC API documentation was found on any
      Jio property. Jio True 5G and enterprise connectivity are marketed on
      jio.com/business as sales-led products with a contact form, not as APIs.
  auth:
    schemes:
    - name: JWT (HS256) bearer
      surface: JioMeet Platform Server API
      note: App id plus a downloadable-once secret generated in the JioMeet console;
        token signed with HMAC SHA-256, documented at
        https://dev.jiomeet.com/docs/quick-start/authentication
    - name: OAuth 2.0 (HTTP Basic for token, HTTP Bearer for calls)
      surface: JioMeet Platform OAuth API
      note: Token from /api/oauth2/v2/token using OAuth client id as username and
        secret as password; subsequent calls use bearer access_token
    ciba:
      found: false
      note: |
        CIBA (Client-Initiated Backchannel Authentication), the mechanism CAMARA
        specifies alongside OIDC for network-based authorization, does not appear
        anywhere on a Jio-operated surface. No Jio OIDC discovery document is served:
        https://www.jio.com/.well-known/openid-configuration returns 200 but with
        content-type text/html (the site's SPA shell, not JSON),
        https://www.jio.com/.well-known/oauth-authorization-server behaves identically,
        https://platform.jiomeet.com/.well-known/openid-configuration and
        https://dev.jiomeet.com/.well-known/openid-configuration both return 404, and
        https://api.jio.com/.well-known/openid-configuration returns 403.
  webhooksAndEvents:
    found: false
    note: |
      No webhook catalog and no AsyncAPI document were found. The nearest event surface
      documented is browser postMessage events for the JioMeet web iframe embed
      (https://dev.jiomeet.com/docs/1.0.0/web/postmessages-events), which is an in-page
      messaging contract, not a server-to-server webhook.
  graphqlGrpcProto:
    graphql: false
    grpc: false
    note: No /graphql surface and no published .proto files were found.
  sdks:
    githubOrganizations:
    - url: https://github.com/JioMeet
      publicRepos: 34
      note: |
        The substantive open-source surface. Public client SDKs include
        JioMeetCoreSDK_iOS, JioMeetCoreSDK_ANDROID, JioMeetCoreSDK_Web,
        JioMeetCoreTemplateSDK_Flutter, JioMeetCoreTemplateSDK_ReactNative,
        JioMeet-rtc-engine-ios, JMMediaStackSDK_iOS / _Android,
        JioMeetVideoKYCSDK_iOS / _Android, JioTranslateCoreSDK_iOS / _Android,
        JioLocalizationSDK for iOS / Android / Web / React / Angular, plus healthcare
        and watch-party template SDKs.
    - url: https://api.github.com/orgs/RelianceJio
      publicRepos: 0
      note: Organization exists but publishes no public repositories.
    - url: https://api.github.com/orgs/JioPlatforms
      publicRepos: 0
      note: Organization exists but publishes no public repositories.
    packageRegistries:
      note: SDKs are distributed through the GitHub repositories and a Swift Package
        Manager repo (jiomeet-ui-sdk-ios-spm) plus Gradle instructions in the Android
        SDK docs. No first-party npm / PyPI / Maven Central / NuGet package was
        confirmed during this review.
  postman:
    firstPartyWorkspace: false
    note: A public Postman workspace search surfaced only a third-party "JioSaavn"
      workspace published by Postman Atlas, not a Reliance Jio first-party workspace.
  cpaas:
    note: |
      Jio operates its own CPaaS, JioCX, covering SMS, Voice, WhatsApp, RCS, Email and
      Alerts plus branded caller ID (JioCX Verify). Every JioCX page under
      jio.com/business/services/cpaas is a marketing page with a sales contact path -
      no API reference, no sandbox, no key issuance, no documentation link. jiocx.com
      and developer.jiocx.com both return 403. So Jio simultaneously competes with the
      CPaaS aggregators and behaves like the carriers those aggregators out-publish.
  channelToDevelopers: |
    For network APIs: intermediated. Aduna (Jio is an equity owner), the GSMA federated
    hub for CAMARA, and CPaaS partners - never directly from Jio. For SaaS APIs
    (JioMeet, JioEvents): direct and self-serve at dev.jiomeet.com. For device/app
    ecosystems (set-top box, games): first-party developer programmes with sign-up walls.
transports:
- protocol: REST
  scheme: https
  documented: true
  note: JioMeet Platform Server API, JioMeet Platform OAuth API and JioEvents Platform
    Server API are documented as HTTPS REST. No public base URL host is stated in the
    documentation; the operation pages render server details client-side and no server
    URL was recoverable from the served static assets, so no baseURL is recorded.
- protocol: WebRTC
  documented: true
  note: Underlying media transport for the JioMeet client SDKs (JMMediaStackSDK,
    VoiceActivityDetector, WebRtcVad). Not an addressable public API.
- protocol: WebSocket
  scheme: wss
  documented: false
  note: No WebSocket endpoint is documented on any Jio developer surface.
- protocol: GraphQL
  documented: false
- protocol: gRPC
  documented: false
